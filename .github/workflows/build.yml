name: Native desktop builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: MemeGenieAI
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python memegenie_ai.py --smoke-test
      - run: python build.py
      - name: Smoke test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath release/MemeGenieAI/MemeGenieAI.exe -ArgumentList '--smoke-test' -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw "Application startup failed: $($p.ExitCode)" }
      - name: Smoke test Unix executable
        if: runner.os != 'Windows'
        run: ./release/MemeGenieAI/MemeGenieAI --smoke-test
      - run: python package_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: MemeGenieAI-${{ runner.os }}-${{ runner.arch }}
          path: MemeGenieAI/artifacts/*
          if-no-files-found: error
